[[IgnoredVulns]]
id = "GHSA-5gmw-xhrv-c9v3"
reason = """tinypool 1.1.1 (vitest 3's worker pool): worker options read through Object.prototype turn a prototype-pollution primitive elsewhere in the process into code execution in the test workers. Needs a separate prototype-pollution bug inside the test process, where every module is already our own test code and its dev dependencies, which run with the same privileges anyway. Dev-only. Re-check trigger: the vitest 4 migration PR (tinypool 2.1.2)."""

[[IgnoredVulns]]
