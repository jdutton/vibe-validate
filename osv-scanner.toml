reason = """tinypool 1.1.1: pool.run() options read `filename` through Object.prototype, the same prototype-pollution gadget class as GHSA-5gmw-xhrv-c9v3. Same precondition (a pollution primitive inside the test process) and same dev-only reach. Re-check trigger: the vitest 4 migration PR (tinypool 2.1.2)."""
